name: Validar vitrine

on:
  pull_request:
  push:
    branches: [main, redesign/mwx-bots-v2]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Instalar Pillow
        run: python3 -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Autoteste do validador
        run: python3 tools/validar.py --autoteste
      - name: Validar páginas e recursos
        run: python3 tools/validar.py
      - name: Links externos (informativo, não bloqueia)
        continue-on-error: true
        timeout-minutes: 3
        run: python3 tools/validar.py --externos
