name: Validar vitrine

on:
  pull_request:
  push:
    branches: [main, redesign/mwx-bots-v2]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/validar.py
